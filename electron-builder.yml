appId: com.tokflow.app
productName: TokFlow
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - node_modules/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TokFlow
portable:
  artifactName: ${productName}-${version}-portable.${ext}
